spring.application.name=kotlin-simple-service
logging.level.org.springframework.security=DEBUG

spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.url=jdbc:postgresql://localhost:5432/sakila

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/simple-application-realm

server.ssl.key-store-type=PKCS12
server.ssl.key-store=classpath:keystore/server.p12
server.ssl.key-store-password=changeit
server.ssl.key-alias=server
server.ssl.client-auth=need
server.ssl.trust-store=classpath:keystore/server-truststore.p12
server.ssl.trust-store-password=changeit
server.ssl.trust-store-type=PKCS12
server.ssl.enabled=true
